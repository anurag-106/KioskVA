[server]
ip = 10.1.50.100
port = 443

[kiosk]
id = KIOSK-CHANGE-ME
local_port = 8080

[database]
path = /var/lib/vst-kiosk/kiosk.db
purge_days = 30

[logging]
level = INFO

[ssl]
verify = true
# Server's certs/server.crt, copied to the kiosk
ca_bundle = /etc/vst-kiosk/server.crt
# Local HTTPS for the kiosk page (generated by postinst)
local_cert = /etc/vst-kiosk/local.crt
local_key = /etc/vst-kiosk/local.key
